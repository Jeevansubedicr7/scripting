<!DOCTYPE html>
<html>
<head>
    <title>Arrow Function Math Operations</title>
</head>

<body>

    <h2>Mathematical Operations Using Arrow Functions</h2>

    <script>
        let add = (a, b) => a + b;

        let subtract = (a, b) => a - b;

        let multiply = (a, b) => a * b;

        let divide = (a, b) => a / b;


        let num1 = 10;
        let num2 = 5;

        document.write("Addition = " + add(num1, num2) + "<br>");
        document.write("Subtraction = " + subtract(num1, num2) + "<br>");
        document.write("Multiplication = " + multiply(num1, num2) + "<br>");
        document.write("Division = " + divide(num1, num2));
    </script>

</body>
</html>
