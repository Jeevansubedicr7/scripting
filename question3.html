<!DOCTYPE html>
<html>
<head>
    <title>Sum of Even Numbers</title>
</head>
<body>

<h2>Sum of Even Numbers</h2>

<script>
function sumEvenNumbers(arr) {
    let sum = 0;

    arr.forEach(function(number) {
        if (number % 2 === 0) {
            sum += number;
        }
    });

    return sum;
}

let numbers = [ 4, 5, 6, 7, 8, 9, 11, 12];

let result = sumEvenNumbers(numbers);

document.write("Sum of even numbers = " + result);
</script>

</body>
</html>
